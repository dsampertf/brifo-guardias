<style>
  :root {

    --fire-dark: #B83008;
    --fire-light: #FF6B35;
    --gold: #F5A623;
    --dark: #0D1117;
    --dark2: #161B22;
    --dark3: #21262D;
    --dark4: #30363D;
    --text: #E6EDF3;
    --text2: #8B949E;
    --text3: #6E7681;
    --green: #3FB950;
    --red: #F85149;
    --blue: #58A6FF;
    --yellow: #E3B341;
    --border: #30363D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* HEADER */
  .app-header {
    background: linear-gradient(135deg, var(--dark2) 0%, #1a0a00 100%);
    border-bottom: 2px solid var(--fire);
    padding: 0;
    position: relative;
    overflow: hidden;
  }
  .app-header::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -10%;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(232,64,10,0.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-inner {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 16px 32px;
    position: relative;
    z-index: 1;
  }
  .header-logo {
    width: 52px;
    height: 52px;
    background: var(--fire);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 22px;
    color: white;
    flex-shrink: 0;
    box-shadow: 0 0 20px rgba(232,64,10,0.4);
  }
  .header-titles { flex: 1; }
  .header-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 26px;
    letter-spacing: 1px;
    color: var(--text);
    line-height: 1;
  }
  .header-subtitle {
    font-size: 12px;
    color: var(--text2);
    margin-top: 3px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .header-lang {
    display: flex;
    gap: 6px;
  }
  .lang-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  .lang-btn.active, .lang-btn:hover {
    border-color: var(--fire);
    color: var(--fire);
  }
  .admin-link {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text3);
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    letter-spacing: 1px;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .admin-link:hover { border-color: var(--text2); color: var(--text2); }

  /* MAIN */
  .app-main {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px;
  }

  /* GUARDIA CARD */
  .guardia-card {
    background: var(--dark2);
    border: 1px solid var(--border);
    border-left: 4px solid var(--fire);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 28px;
    position: relative;
  }
  .guardia-card.closed { border-left-color: var(--text3); }
  .guardia-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(232,64,10,0.15);
    border: 1px solid rgba(232,64,10,0.3);
    color: var(--fire-light);
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .guardia-badge.closed-badge {
    background: rgba(110,118,129,0.15);
    border-color: rgba(110,118,129,0.3);
    color: var(--text3);
  }
  .guardia-badge .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--fire-light);
    animation: pulse 1.5s infinite;
  }
  .guardia-badge.closed-badge .dot { background: var(--text3); animation: none; }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .guardia-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 16px;
    line-height: 1.1;
  }
  .guardia-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .guardia-field { }
  .guardia-field-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 3px;
  }
  .guardia-field-value {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }
  .guardia-field-value.highlight { color: var(--gold); }

  /* DEADLINE */
  .deadline-bar {
    background: var(--dark3);
    border-radius: 6px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .deadline-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; }
  .deadline-value { font-size: 14px; font-weight: 600; color: var(--text); }
  .countdown {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }
  .countdown.urgent { background: rgba(248,81,73,0.2); color: var(--red); border: 1px solid rgba(248,81,73,0.3); }
  .countdown.ok { background: rgba(63,185,80,0.2); color: var(--green); border: 1px solid rgba(63,185,80,0.3); }
  .countdown.warning { background: rgba(227,179,65,0.2); color: var(--yellow); border: 1px solid rgba(227,179,65,0.3); }

  /* FORM */
  .form-section {
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .form-section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text2);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .form-section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .form-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .form-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 140px; }
  .form-label { font-size: 12px; color: var(--text2); font-weight: 500; letter-spacing: 0.5px; }
  .form-input {
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 10px 14px;
    font-size: 15px;
    font-family: 'Barlow', sans-serif;
    transition: border-color 0.2s;
    outline: none;
    width: 100%;
  }
  .form-input:focus { border-color: var(--fire); }
  .form-input::placeholder { color: var(--text3); }
  .form-input.error { border-color: var(--red); }

  /* BUTTONS */
  .btn {
    padding: 12px 24px;
    border-radius: 6px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-primary {
    background: var(--fire);
    color: white;
    width: 100%;
    justify-content: center;
    margin-top: 8px;
  }
  .btn-primary:hover { background: var(--fire-light); box-shadow: 0 0 20px rgba(232,64,10,0.4); }
  .btn-primary:disabled { background: var(--dark4); color: var(--text3); cursor: not-allowed; box-shadow: none; }
  .btn-secondary {
    background: var(--dark3);
    color: var(--text2);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--text2); color: var(--text); }
  .btn-success { background: var(--green); color: white; width: 100%; justify-content: center; margin-top: 8px; }
  .btn-success:hover { background: #4dc961; }

  /* ALERT BOXES */
  .alert {
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 14px;
    line-height: 1.5;
  }
  .alert-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
  .alert-green { background: rgba(63,185,80,0.1); border: 1px solid rgba(63,185,80,0.3); color: #7ee787; }
  .alert-red { background: rgba(248,81,73,0.1); border: 1px solid rgba(248,81,73,0.3); color: #ffa198; }
  .alert-yellow { background: rgba(227,179,65,0.1); border: 1px solid rgba(227,179,65,0.3); color: #f0c040; }
  .alert-blue { background: rgba(88,166,255,0.1); border: 1px solid rgba(88,166,255,0.3); color: #79c0ff; }

  .priority-box {

    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;

  .priority-name { font-size: 15px; font-weight: 600; color: var(--text); }

    align-items: center;
    gap: 10px;

  th {

    padding: 10px 12px;
    text-align: left;
    color: var(--text2);
    font-weight: 600;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;

  td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--dark3);
    color: var(--text);
    vertical-align: middle;
  }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .tag-green { background: rgba(63,185,80,0.2); color: var(--green); }
  .tag-red { background: rgba(248,81,73,0.2); color: var(--red); }
  .tag-yellow { background: rgba(227,179,65,0.2); color: var(--yellow); }
  .tag-blue { background: rgba(88,166,255,0.2); color: var(--blue); }
  .tag-gray { background: rgba(110,118,129,0.2); color: var(--text2); }

  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab {
    padding: 10px 20px;
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    font-weight: 500;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.2s;
  }
  .tab.active { color: var(--fire); border-bottom-color: var(--fire); }
  .tab:hover { color: var(--text2); }

  /* NO GUARDIA */
  .no-guardia {

    padding: 60px 20px;
    color: var(--text3);
  }
  .no-guardia .icon { font-size: 48px; margin-bottom: 16px; }
  .no-guardia h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; color: var(--text2); margin-bottom: 8px; }

  /* DIVIDER */
  .divider { height: 1px; background: var(--border); margin: 20px 0; }

  /* STATS ROW */
  .stats-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat-box {
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 18px;
    flex: 1;
    min-width: 120px;
  }
  .stat-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .stat-value { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 700; color: var(--text); }
  .stat-value.fire { color: var(--fire); }
  .stat-value.green { color: var(--green); }
  .stat-value.blue { color: var(--blue); }

  /* FOOTER */
  .app-footer {
    text-align: center;
    padding: 24px;
    color: var(--text3);
    font-size: 12px;
    border-top: 1px solid var(--dark3);
    margin-top: 40px;
  }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal {
    background: var(--dark2);
    border: 1px solid var(--border);
    border-top: 3px solid var(--fire);
    border-radius: 10px;
    padding: 28px;
    width: 100%;
    max-width: 500px;
    position: relative;
  }
  .modal-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 20px;
    color: var(--text);
  }
  .modal-close {
    position: absolute;
    top: 16px; right: 16px;
    background: none; border: none;
    color: var(--text3); font-size: 20px; cursor: pointer;
  }
  .modal-close:hover { color: var(--text); }

  @media (max-width: 600px) {
    .header-inner { padding: 14px 16px; }
    .header-title { font-size: 20px; }
    .app-main { padding: 20px 12px; }
    .guardia-title { font-size: 22px; }
  }
</style>

// ─── CALENDAR HELPERS ───────────────────────────────────────────────────────
function getDayIndex(dateStr) {
  // dateStr: "YYYY-MM-DD"
  const d = new Date(dateStr + 'T00:00:00');
  const start = new Date('2026-01-01T00:00:00');
  return Math.round((d - start) / 86400000);
}

function getTurnStatus(turno, dateStr) {
  // Returns: 0=libre, 1=trabaja, 2=vacaciones
  const idx = getDayIndex(dateStr);
  if (idx < 0 || idx > 364) return 0;
  const key = String(turno);
  if (!CALENDAR_2026[key]) return 0;
  return CALENDAR_2026[key][idx];
}

function worksOnDay(turno, dateStr) {
  return getTurnStatus(turno, dateStr) === 1;
}

function check12hRule(turno, guardiaDateStr, guardiaStartHour, guardiaDurationHours) {
  // Turno works 08:00-18:00
  // Returns { ok: bool, reason: string }
  const dayBefore = new Date(guardiaDateStr + 'T00:00:00');
  dayBefore.setDate(dayBefore.getDate() - 1);
  const dayBeforeStr = dayBefore.toISOString().split('T')[0];

  const dayAfter = new Date(guardiaDateStr + 'T00:00:00');
  dayAfter.setDate(dayAfter.getDate() + 1);
  const dayAfterStr = dayAfter.toISOString().split('T')[0];

  const guardiaStart = new Date(`${guardiaDateStr}T${String(guardiaStartHour).padStart(2,'0')}:00:00`);
  const guardiaEnd = new Date(guardiaStart.getTime() + guardiaDurationHours * 3600000);

  // Check day before: if they work 08:00-18:00, need 12h rest before guardia
  if (worksOnDay(turno, dayBeforeStr)) {
    const prevEnd = new Date(`${dayBeforeStr}T18:00:00`);
    const restBefore = (guardiaStart - prevEnd) / 3600000;
    if (restBefore < 12) {
      return { ok: false, type: 'before', hoursShort: (12 - restBefore).toFixed(1) };
    }
  }

  // Check day after: if they work 08:00-18:00, need 12h rest after guardia
  if (worksOnDay(turno, dayAfterStr)) {
    const nextStart = new Date(`${dayAfterStr}T08:00:00`);
    const restAfter = (nextStart - guardiaEnd) / 3600000;
    if (restAfter < 12) {
      return { ok: false, type: 'after', hoursShort: (12 - restAfter).toFixed(1) };
    }
  }

  return { ok: true };
}

// ─── DNI NORMALIZER ─────────────────────────────────────────────────────────
function normalizeDNI(raw) {
  return raw.replace(/[.\-,\s]/g, '').toUpperCase();
}

function isValidDNIFormat(dni) {
  return /^\d{8}[A-Z]$/.test(dni);
}

  try {
    const res = await fetch(GAS_URL + '?action=' + action);
    return await res.json();
  } catch(e) { return null; }
}

async function gasPost(body) {
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify(body)
    });
    return await res.json();
  } catch(e) { return null; }
}

// ─── COUNTDOWN ──────────────────────────────────────────────────────────────
function useCountdown(deadlineISO) {
  const [diff, setDiff] = useState(null);
  useEffect(() => {
    if (!deadlineISO) return;
    const update = () => {
      const now = new Date();
      const end = new Date(deadlineISO);
      const ms = end - now;
      setDiff(ms);
    };
    update();
    const t = setInterval(update, 1000);
    return () => clearInterval(t);
  }, [deadlineISO]);
  return diff;
}

function formatCountdown(ms) {
  if (ms <= 0) return { text: '00:00:00', cls: 'urgent' };
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  const text = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const cls = ms < 3600000 ? 'urgent' : ms < 86400000 ? 'warning' : 'ok';
  return { text, cls };
}

    setSyncError(false);
    try {

        gasGet('getSolicitudes'),
        gasGet('getHoras')
      ]);

  const countdown = useCountdown(deadlineISO);
  const isOpen = guardia && countdown !== null && countdown > 0;
  const maxReached = guardia && solicitudes.filter(s => !s.late).length >= parseInt(guardia.maxPersonas || 999);

  // ── AUTH ──
  function handleLogin() {
    setAuthError('');
    const dni = normalizeDNI(dniInput);
    if (!isValidDNIFormat(dni)) { setAuthError(t.invalidDni); return; }
    const person = PERSONAL_DATA.find(p => normalizeDNI(p.dni) === dni);
    if (!person) { setAuthError(t.dniNotFound); return; }
    if (String(person.pin).padStart(5,'0') !== String(pinInput).padStart(5,'0')) {
      setAuthError(t.wrongPin); return;
    }
    setUser(person);
  }

  // ── ELIGIBILITY ──
  function getEligibility() {
    if (!user || !guardia) return null;
    const turno = user.turno;
    const fecha = guardia.fecha;
    const status = getTurnStatus(turno, fecha);

    if (status === 1) return { ok: false, reason: t.worksDay };
    if (status === 2) return { ok: false, reason: t.vacDay };

    const rest = check12hRule(turno, fecha, parseInt(guardia.horaInicio), parseFloat(guardia.duracion));
    if (!rest.ok) {
      return { ok: false, reason: rest.type === 'before' ? t.rest12before : t.rest12after };
    }

    if (!isOpen) return { ok: false, reason: t.closed };
    if (maxReached) return { ok: false, reason: t.maxReached };

    const alreadyApplied = solicitudes.some(s => normalizeDNI(s.dni) === normalizeDNI(user.dni));
    if (alreadyApplied) return { ok: false, reason: t.alreadyApplied };

    return { ok: true };
  }

  // ── PRIORITY ──
  function getPriority() {
    if (!user || !guardia) return null;
    // Get all eligible people sorted by hours
    const eligible = PERSONAL_DATA.filter(p => {
      const status = getTurnStatus(p.turno, guardia.fecha);
      if (status !== 0) return false;
      const rest = check12hRule(p.turno, guardia.fecha, parseInt(guardia.horaInicio), parseFloat(guardia.duracion));
      return rest.ok;
    }).map(p => ({
      ...p,
      hours: horasAcc[normalizeDNI(p.dni)] || 0
    })).sort((a, b) => a.hours - b.hours);

    const myIdx = eligible.findIndex(p => normalizeDNI(p.dni) === normalizeDNI(user.dni));
    return { rank: myIdx + 1, total: eligible.length };
  }

      (isLate ? `⚠ SOLICITUD FUERA DE PLAZO – enviada el ${new Date().toLocaleString('es-ES')}\n` : '')
    );
    window.location.href = `mailto:guardiasextra@bombersdv.es?subject=${subject}&body=${body}`;
  }

  // ── ADMIN PUBLISH ──
  async function handlePublish() {
    if (!adminForm.fecha || !adminForm.deadlineDate || !adminForm.descripcion) return;
    setSyncing(true);
    const g = { ...adminForm, id: Date.now() };

                </div>
              </div>
            )}

            {/* Eligibility */}
            {eligibility && (
              <div className={`alert ${eligibility.ok ? 'alert-green' : 'alert-red'}`} style={{marginBottom:16}}>
                <span className="alert-icon">{eligibility.ok ? '✓' : '✕'}</span>
                <div>
                  <strong>{t.yourStatus}:</strong><br/>
                  {eligibility.ok ? t.eligible : eligibility.reason}
                </div>
              </div>
            )}

            {/* Send button */}
            {eligibility?.ok && (
              <div className="form-section" style={{paddingTop:16,paddingBottom:16}}>
                <div style={{fontSize:13,color:'var(--text2)',marginBottom:12}}>📧 {t.emailNote}</div>
                <button className="btn btn-success" onClick={handleSendRequest}>
                  🚒 {t.sendRequest}
                </button>
              </div>
            )}

            {/* My history */}
            <div className="form-section" style={{marginTop:16}}>
              <div className="form-section-title">{t.myHours}</div>
              {Object.keys(horasAcc).length === 0 || !horasAcc[normalizeDNI(user.dni)] ? (
                <p style={{color:'var(--text3)',fontSize:14}}>{t.noHistory}</p>
              ) : (
                <div style={{fontSize:15,color:'var(--text)'}}>
                  {lang==='es'?'Horas acumuladas de guardias extraordinarias:':'Hores acumulades de guàrdies extraordinàries:'}{' '}
                  <strong style={{color:'var(--gold)',fontSize:20}}>{horasAcc[normalizeDNI(user.dni)]}h</strong>
                </div>
              )}
            </div>
          </>
        )}

      </main>

      {/* ── ADMIN MODAL ── */}
      {showAdminModal && (
        <div className="modal-overlay" onClick={e => e.target===e.currentTarget && setShowAdminModal(false)}>
          <div className="modal" style={{maxWidth: adminLoggedIn ? 900 : 400}}>
            <button className="modal-close" onClick={()=>setShowAdminModal(false)}>✕</button>

            {!adminLoggedIn ? (
              <>
                <div className="modal-title">🔒 {t.adminPanel}</div>
                <div className="form-group" style={{marginBottom:14}}>
                  <label className="form-label">{t.adminPass}</label>
                  <input
                    className={`form-input ${adminPassError?'error':''}`}
                    type="password"
                    value={adminPassInput}
                    onChange={e=>setAdminPassInput(e.target.value)}
                    onKeyDown={e=>{if(e.key==='Enter'){if(adminPassInput===ADMIN_PASS){setAdminLoggedIn(true);setAdminPassError('');}else{setAdminPassError(lang==='es'?'Contraseña incorrecta':'Contrasenya incorrecta');}}}}
                    placeholder="••••••••"
                  />
                  {adminPassError && <div style={{fontSize:12,color:'var(--red)',marginTop:4}}>{adminPassError}</div>}
                </div>
                <button className="btn btn-primary" onClick={()=>{
                  if(adminPassInput===ADMIN_PASS){setAdminLoggedIn(true);setAdminPassError('');}
                  else setAdminPassError(lang==='es'?'Contraseña incorrecta':'Contrasenya incorrecta');
                }}>{t.adminLogin}</button>
              </>
            ) : (
              <>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
                  <div className="admin-title">⚙ {t.adminPanel}</div>
                  <button className="btn btn-secondary" style={{padding:'6px 14px',fontSize:13}} onClick={()=>{setAdminLoggedIn(false);setAdminPassInput('');}}>{t.adminLogout}</button>
                </div>

                <div className="tabs">
                  <button className={`tab ${adminTab==='applicants'?'active':''}`} onClick={()=>setAdminTab('applicants')}>{t.tabs_applicants} ({solicitudes.length})</button>
                  <button className={`tab ${adminTab==='publish'?'active':''}`} onClick={()=>setAdminTab('publish')}>{t.tabs_publish}</button>
                  <button className={`tab ${adminTab==='history'?'active':''}`} onClick={()=>setAdminTab('history')}>{t.history}</button>
                </div>

                {/* APPLICANTS TAB */}
                {adminTab==='applicants' && (
                  <>
                    <div className="stats-row">
                      <div className="stat-box"><div className="stat-label">{lang==='es'?'En plazo':'En termini'}</div><div className="stat-value green">{sortedApplicants.length}</div></div>
                      <div className="stat-box"><div className="stat-label">{lang==='es'?'Fuera de plazo':'Fora de termini'}</div><div className="stat-value fire">{lateApplicants.length}</div></div>
                      <div className="stat-box"><div className="stat-label">{lang==='es'?'Plazas restantes':'Places restants'}</div><div className="stat-value blue">{Math.max(0,(parseInt(guardia?.maxPersonas||0)-sortedApplicants.length))}</div></div>
                    </div>
                    {solicitudes.length === 0 ? (
                      <p style={{color:'var(--text3)',textAlign:'center',padding:'30px 0'}}>{t.noApplicants}</p>
                    ) : (
                      <>
                        <button className="btn btn-secondary" style={{marginBottom:12,fontSize:13,padding:'7px 16px'}} onClick={exportCSV}>📊 {t.exportExcel}</button>
                        <div className="table-wrap">
                          <table>
                            <thead>
                              <tr>
                                <th>{t.rank}</th><th>{t.name}</th><th>{t.dni}</th>
                                <th>{t.turn}</th><th>{t.category}</th>
                                <th>{t.accHours}</th><th>{t.appliedAt}</th><th></th>
                              </tr>
                            </thead>
                            <tbody>
                              {sortedApplicants.map((s,i)=>(
                                <tr key={s.id}>
                                  <td><strong style={{color:'var(--fire)'}}>{i+1}</strong></td>
                                  <td style={{fontWeight:500}}>{s.nombre}</td>
                                  <td style={{fontFamily:'monospace',fontSize:12}}>{s.dni}</td>
                                  <td><span className="tag tag-blue">T{s.turno}</span></td>
                                  <td><span className="tag tag-gray">{s.categoria}</span></td>
                                  <td><strong style={{color:'var(--gold)'}}>{s.horasAcc||0}h</strong></td>
                                  <td style={{fontSize:12,color:'var(--text2)'}}>{new Date(s.appliedAt).toLocaleString('es-ES')}</td>
                                  <td><span className="tag tag-green">{lang==='es'?'En plazo':'En termini'}</span></td>
                                </tr>
                              ))}
                              {lateApplicants.map((s,i)=>(
                                <tr key={s.id} style={{opacity:0.6}}>
                                  <td>–</td>
                                  <td>{s.nombre}</td>
                                  <td style={{fontFamily:'monospace',fontSize:12}}>{s.dni}</td>
                                  <td><span className="tag tag-blue">T{s.turno}</span></td>
                                  <td><span className="tag tag-gray">{s.categoria}</span></td>
                                  <td>{s.horasAcc||0}h</td>
                                  <td style={{fontSize:12,color:'var(--text2)'}}>{new Date(s.appliedAt).toLocaleString('es-ES')}</td>
                                  <td><span className="tag tag-red">{t.late}</span></td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </>
                    )}
                  </>
                )}

                {/* PUBLISH TAB */}
                {adminTab==='publish' && (
                  <div>
                    <div className="form-row" style={{marginBottom:12}}>
                      <div className="form-group" style={{flex:2}}>
                        <label className="form-label">{t.description}</label>
                        <input className="form-input" value={adminForm.descripcion}
                          onChange={e=>setAdminForm({...adminForm,descripcion:e.target.value})}
                          placeholder={lang==='es'?'Ej: Incendio forestal – Serra':'Ex: Incendi forestal – Serra'}/>
                      </div>
                    </div>
                    <div className="form-row" style={{marginBottom:12}}>
                      <div className="form-group">
                        <label className="form-label">{t.dateField}</label>
                        <input className="form-input" type="date" value={adminForm.fecha}
                          onChange={e=>setAdminForm({...adminForm,fecha:e.target.value})}/>
                      </div>
                      <div className="form-group" style={{maxWidth:120}}>
                        <label className="form-label">{t.startHour}</label>
                        <input className="form-input" type="number" min="0" max="23" value={adminForm.horaInicio}
                          onChange={e=>setAdminForm({...adminForm,horaInicio:e.target.value})}/>
                      </div>
                      <div className="form-group" style={{maxWidth:120}}>
                        <label className="form-label">{t.durationH}</label>
                        <input className="form-input" type="number" min="1" max="24" value={adminForm.duracion}
                          onChange={e=>setAdminForm({...adminForm,duracion:e.target.value})}/>
                      </div>
                      <div className="form-group" style={{maxWidth:100}}>
                        <label className="form-label">{t.maxPeople}</label>
                        <input className="form-input" type="number" min="1" value={adminForm.maxPersonas}
                          onChange={e=>setAdminForm({...adminForm,maxPersonas:e.target.value})}/>
                      </div>
                    </div>
                    <div className="form-row" style={{marginBottom:16}}>
                      <div className="form-group">
                        <label className="form-label">{t.deadlineDate}</label>
                        <input className="form-input" type="date" value={adminForm.deadlineDate}
                          onChange={e=>setAdminForm({...adminForm,deadlineDate:e.target.value})}/>
                      </div>
                      <div className="form-group" style={{maxWidth:140}}>
                        <label className="form-label">{t.deadlineHour}</label>
                        <input className="form-input" type="time" value={adminForm.deadlineHour}
                          onChange={e=>setAdminForm({...adminForm,deadlineHour:e.target.value})}/>
                      </div>
                    </div>
                    <button className="btn btn-primary"
                      onClick={handlePublish}
                      disabled={!adminForm.fecha||!adminForm.deadlineDate||!adminForm.descripcion}>
                      🚨 {guardia ? t.updateBtn : t.publishBtn}
                    </button>
                  </div>
                )}

                {/* HISTORY TAB */}
                {adminTab==='history' && (
                  <div>
                    <p style={{fontSize:13,color:'var(--text2)',marginBottom:14}}>
                      {lang==='es'
                        ? 'Edita las horas acumuladas por persona. Estas horas determinan el orden de prioridad.'
                        : 'Edita les hores acumulades per persona. Aquestes hores determinen l\'ordre de prioritat.'}
                    </p>
                    <div className="table-wrap" style={{maxHeight:400,overflowY:'auto'}}>
                      <table>
                        <thead>
                          <tr>
                            <th>{t.name}</th><th>{t.dni}</th><th>{t.turn}</th>
                            <th>{t.totalHours}</th>
                          </tr>
                        </thead>
                        <tbody>
                          {PERSONAL_DATA.slice(0,50).map(p=>(
                            <tr key={p.id}>
                              <td style={{fontSize:12}}>{p.nombre}</td>
                              <td style={{fontFamily:'monospace',fontSize:11}}>{p.dni}</td>
                              <td><span className="tag tag-blue">T{p.turno}</span></td>
                              <td>
                                <input
                                  type="number" min="0" step="0.5"
                                  value={horasAcc[normalizeDNI(p.dni)]||0}
                                  onChange={e=>updateHours(p.dni,e.target.value)}
                                  style={{
                                    background:'var(--dark3)',border:'1px solid var(--border)',
                                    borderRadius:4,color:'var(--text)',padding:'4px 8px',
                                    width:70,fontSize:13
                                  }}
                                />
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                    <p style={{fontSize:11,color:'var(--text3)',marginTop:8}}>
                      {lang==='es'?`Mostrando primeros 50 de ${PERSONAL_DATA.length} efectivos`:`Mostrant primers 50 de ${PERSONAL_DATA.length} efectius`}
                    </p>
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      )}

      <footer className="app-footer">
        Bombers de la Diputació de València · Sistema de Guardias Extraordinarias 2026
      </footer>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>


</body>
</html>
